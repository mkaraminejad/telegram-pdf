services:
  redis:
    image: redis:7-alpine
    container_name: persian_pdf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bot_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: persian_pdf_bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/data/temp
    volumes:
      - temp_storage:/app/data/temp
    networks:
      - bot_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: persian_pdf_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/data/temp
      - TESSERACT_LANG=fas+eng
      - TESSERACT_CMD=/usr/bin/tesseract
    volumes:
      - temp_storage:/app/data/temp
    networks:
      - bot_network

volumes:
  redis_data:
  temp_storage:

networks:
  bot_network:
    driver: bridge
